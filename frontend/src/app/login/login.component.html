<div class="login-container">
  <!-- LEFT SECTION -->
  <div class="login-left">
    <img src="assets/compserv.png" alt="Compserv Logo" class="logo-img">
    <h2 class="company-name">Compserv Consultants</h2>
    <p class="company-tag">PRIVATE LIMITED</p>
    <div class="divider"></div>
    <p class="company-desc">Powering Enterprise Solutions with Innovation & Technology</p>
  </div>

  <!-- RIGHT LOGIN CARD -->
  <div class="login-right">
    <div class="login-card">
      <h3 class="welcome-title">Welcome</h3>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <!-- Username -->
        <div class="form-control">
          <label class="form-label">
            <svg class="form-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Enter Username</span>
          </label>
          <input type="text" formControlName="username" class="form-input" placeholder="Enter Username" />
          <span class="error-text" *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid">
            Username is required
          </span>
        </div>

        <!-- Password -->
        <div class="form-control">
          <label class="form-label">
            <svg class="form-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <span>Enter Password</span>
          </label>
          <div class="password-wrapper">
            <input [type]="showPassword ? 'text' : 'password'" formControlName="password" class="form-input" placeholder="Enter Password" />
            <button type="button" class="toggle-password" (click)="togglePasswordVisibility()">
              {{ showPassword ? '👁️' : '👁️‍🗨️' }}
            </button>
          </div>
          <span class="error-text" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
            Password is required
          </span>
        </div>

        <!-- Error Message -->
        <p class="error-message" *ngIf="loginError">{{ loginError }}</p>

        <!-- Buttons -->
        <div class="button-group">
          <button type="submit" class="btn btn-login" [disabled]="isLoading">
            {{ isLoading ? 'LOGGING IN...' : 'LOGIN' }}
          </button>
          <button type="button" class="btn btn-reset" (click)="resetForm()">RESET</button>
          <hr class="divider-line">
          <button type="button" class="btn btn-google" (click)="onGoogleLogin()">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="google-icon" />
            <span>Sign in with Google</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Background Blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>
