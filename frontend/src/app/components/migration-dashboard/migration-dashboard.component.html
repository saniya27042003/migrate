<div class="dashboard">
    <h2>Migration Dashboard</h2>

    <section>
        <h3>Foundation Tables</h3>
        <div class="grid">
            <button *ngFor="let table of foundationTables" (click)="selectedParent = table; checkTableSync(table)"
                [class.active]="selectedParent === table" [class.success]="isMigrated(table)">
                {{ isMigrated(table) ? '✅ ' + table : table }}
            </button>
        </div>
    </section>

    <div class="main-body">
        <aside class="sidebar">

            <div class="sidebar-section">
                <h3>Master Tables</h3>
                <button *ngFor="let table of coreEntities" [class.active]="selectedParent === table"
                    [class.success]="isMigrated(table)" (click)="selectedParent = table; checkTableSync(table)">
                    {{ isMigrated(table) ? '✅ ' + table : table }}
                </button>
            </div>

            <div class="sidebar-section" style="margin-top: 2rem;">
                <h3>Transaction Tables</h3>
                <button *ngFor="let table of transactionTables" [class.active]="selectedParent === table"
                    [class.success]="isMigrated(table)" (click)="selectedParent = table; checkTableSync(table)">
                    {{ isMigrated(table) ? '✅ ' + table : table }}
                </button>
            </div>

        </aside>

        <div class="detail-panel" *ngIf="selectedParent">
            <div *ngIf="validationError" class="alert-warning"
                style="color: red; font-weight: bold; margin-bottom: 10px;">
                ⚠️ {{ validationError }}
            </div>

            <h3>Dependencies for: {{ selectedParent }}</h3>

            <div class="dependency-grid">
                <button *ngFor="let child of dependencyMap[selectedParent]" (click)="startMigration(child)"
                    [disabled]="isMigrated(child)" [class.success]="isMigrated(child)">
                    {{ isMigrated(child) ? '✅ Migrated ' + child : 'Migrate ' + child }}
                </button>
                <div *ngIf="!dependencyMap[selectedParent] || dependencyMap[selectedParent].length === 0" style="color: gray; font-style: italic;">
                    No dependencies required.
                </div>
            </div>

            <hr>

              <div *ngIf="isLoading" class="progress-box">
                    <h4>Migrating {{ selectedParent }}...</h4>
                    <div class="progress-container">
                        <div class="progress-bar" [style.width.%]="progress"></div>
                    </div>
                    <p>{{ progress }}%</p>
                </div>

            <button class="exec-btn" (click)="startMigration(selectedParent)"
                [disabled]="!!validationError || !canMigrateMaster(selectedParent) || isMigrated(selectedParent)"
                [class.success]="isMigrated(selectedParent)">

                <ng-container *ngIf="isMigrated(selectedParent)">
                    ✅ {{ selectedParent }} Fully Migrated
                </ng-container>

                <ng-container *ngIf="!isMigrated(selectedParent) && !!validationError">
                    Fix Data Mismatch First
                </ng-container>

                <ng-container
                    *ngIf="!isMigrated(selectedParent) && !validationError && canMigrateMaster(selectedParent)">
                    Execute Full {{ selectedParent }} Migration
                </ng-container>

                <ng-container
                    *ngIf="!isMigrated(selectedParent) && !validationError && !canMigrateMaster(selectedParent)">
                    🔒 Complete Dependencies to Unlock {{ selectedParent }}
                </ng-container>
            </button>
        </div>
    </div>


</div>
